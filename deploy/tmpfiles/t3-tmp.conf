# T3-CUSTOM: disk-backed temp directories for the T3 deployments.
#
# /tmp on the dev server is a RAM-backed tmpfs sized at 50% of RAM, mounted with
# usrquota, and systemd applies its default 80% per-user cap. Once `ubuntu` hits
# that cap every write fails with EDQUOT, which surfaces as commands exiting 1
# with no output at all. Each deployment's start.sh therefore points TMPDIR at
# <base-dir>/tmp on the root filesystem instead.
#
# Those directories are on a disk that runs close to full, so expire their
# contents after 7 days. systemd-tmpfiles-clean.timer applies this daily.
#
# Artifact deployment does not install this file. After changing it:
#   sudo install -m 0644 deploy/tmpfiles/t3-tmp.conf /etc/tmpfiles.d/t3-tmp.conf
#   sudo systemd-tmpfiles --create /etc/tmpfiles.d/t3-tmp.conf
#
# Type Path                                Mode UID    GID    Age
d      /home/ubuntu/.t3/bkt3-dev/tmp       0700 ubuntu ubuntu 7d
d      /home/ubuntu/.t3/beknown-dev/tmp    0700 ubuntu ubuntu 7d
d      /home/ubuntu/.t3/expbkt3-dev/tmp    0700 ubuntu ubuntu 7d
d      /home/ubuntu/.t3/stage-dev/tmp      0700 ubuntu ubuntu 7d
